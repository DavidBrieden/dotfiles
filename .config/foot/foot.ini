# It's FOSS / Standard Foot Configuration Example
# Place this file at ~/.config/foot/foot.ini

[main]
# Shell to launch (defaults to $SHELL)
# shell = /bin/bash
# term = foot

# Font configuration
font = Hack Nerd Font:size=12
# fallback-font = DejaVu Sans Mono:size=11

# Window dimensions (in characters)
# initial-window-size-cols = 80
# initial-window-size-lines = 24

# Padding (vertical, horizontal in pixels)
# pad = 10x10

# Cursor style
[cursor]
# style = block
# blink = no

# Colors (Example: Catppuccin / Dark theme)
[colors-dark]
alpha = 0.92
# foreground = cdd6f4
# background = 1e1e2e

[mouse]
hide-when-typing = no
alternate-scroll-mode = yes
